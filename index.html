<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <div class="blog-preview-card">
        <img
          src="./assets/images/illustration-article.svg"
          alt="This image is the illustration belonging to the article"
          class="illustration-article-img"
        />

        <div class="card-content">
          <p class="blog-category text-preset-3-bold">Learning</p>

          <p class="publish-date text-preset-3">Published 21 Dec 2023</p>

          <p class="blog-title text-preset-1">HTML & CSS foundations</p>

          <p class="blog-description text-preset-2">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
        </div>

        <div class="blog-author">
          <img
            src="./assets/images/image-avatar.webp"
            alt="This is an image of the blog author"
            class="author-img"
          />
          <p class="text-preset-3-bold">Greg Hooper</p>
        </div>
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Mohammad Humoud</a>.
    </footer>
  </body>
</html>
